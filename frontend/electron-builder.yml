appId: ru.tpu.snowball
productName: Snowball
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/.env*'
asarUnpack:
  - resources/**
extraResources:
  - from: ../packaging/backend/snowball-backend
    to: backend
    filter:
      - '**/*'
  - from: ../packaging/models
    to: models
    filter:
      - '**/*'
  - from: out/renderer
    to: ui
    filter:
      - '**/*'
win:
  executableName: snowball
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: SnowBall-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Snowball
  uninstallDisplayName: Snowball
  createDesktopShortcut: always
  runAfterFinish: false
compression: normal
npmRebuild: false
