openapi: 3.1.0
info:
  title: snowball-parsing-app API
  version: 0.2.2
  description:
servers:
- url: http://127.0.0.1:8000
  description: Локальный бэкенд (порт задаётся переменной SNOWBALL_PORT)
tags:
- name: service
  description: Служебные точки
- name: vk
  description: Работа с VK
- name: collection
  description: Сбор данных
paths:
  /health:
    get:
      tags:
      - service
      summary: Проверка, что бэкенд запущен
      operationId: health
      responses:
        '200':
          description: Бэкенд работает
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
              example:
                status: ok
  /vk/validate:
    post:
      tags:
      - vk
      summary: Проверить токен VK
      description: 'Проверяет, что токен действителен и подходит для сбора данных.

        Подходят сервисный ключ и ключ пользователя. Ключ сообщества отклоняется (403).

        '
      operationId: validateVkToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
            example:
              token: vk1.a.XXXXXXXX
      responses:
        '200':
          description: Токен действителен и подходит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
              examples:
                serviceToken:
                  summary: Сервисный ключ
                  value:
                    valid: true
                    token_type: service
                userToken:
                  summary: Ключ пользователя
                  value:
                    valid: true
                    token_type: user
                    user:
                      id: 123456
                      name: Иван Иванов
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/UnsupportedTokenType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/VkUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /collection/models:
    get:
      tags:
      - collection
      summary: Список доступных NER-моделей и их настроек
      description: 'Каталог моделей для rules.models. Порядок отображения: сначала GLiNER, затем WikiNEuRal.
        Выбор модели не означает, что её веса уже загружены.'
      operationId: listModels
      responses:
        '200':
          description: Доступные модели
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
              example:
              - id: urchade/gliner_multi-v2.1
                name: GLiNER multi v2.1
                description: Извлечение сущностей с заданными пользователем типами. Основной вариант.
                task: ner
                settings_schema: &id002
                  type: object
                  additionalProperties: false
                  required:
                  - labels
                  properties:
                    labels:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: &id001
                        type: string
                        minLength: 1
                        pattern: \S
                      description: Типы сущностей, например person, organization, city.
              - id: Babelscape/wikineural-multilingual-ner
                name: WikiNEuRal multilingual NER
                description: Дополнительная NER-модель. В этой версии пользовательские настройки не предусмотрены.
                task: ner
                settings_schema: &id003
                  type: object
                  additionalProperties: false
        '500':
          $ref: '#/components/responses/InternalError'
  /collection/start:
    post:
      tags:
      - collection
      summary: Запустить сбор данных
      description: Проверяет запрос, токен и начальные записи VK, затем запускает фоновый сбор. Ответ
        202 со status=running означает принятие задания; фактическое состояние доступно в progress. Подключена
        только основная модель GLiNER из SNO-14. Выбор WikiNeural (в том числе вместе с GLiNER) приводит
        к failed / ML_NOT_AVAILABLE на этапе расширения; модель не игнорируется. Из каждой начальной стены
        берётся до 100 последних записей, из каждого поискового запроса — до 20. Уникальные непустые посты
        сохраняются, сущности ранжируются по числу постов в выборке; каждый нормализованный запрос используется
        один раз. Лимит задания — 5000 постов. Для NER используются первые 4000 символов текста. Ошибки
        ML/VK доступны в progress.
      operationId: startCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
            examples:
              gliner:
                summary: Только основная модель GLiNER
                value:
                  token: VK_TOKEN_PLACEHOLDER
                  seeds:
                  - type: group
                    id: tpu_official
                  - type: post
                    id: '-123456_789'
                  rules:
                    models:
                      urchade/gliner_multi-v2.1:
                        labels:
                        - person
                        - organization
                        - city
                    threshold: 0.5
                    max_depth: 2
                    sample_size: 100
                    top_entities: 5
      responses:
        '202':
          description: Сбор принят и запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
              example:
                collection_id: 3f2a9c1e
                status: running
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/UnsupportedTokenType'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/VkUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /collection/{collection_id}/progress:
    get:
      tags:
      - collection
      summary: Получить состояние и прогресс сбора
      operationId: get_collection_progress_collection__collection_id__progress_get
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          title: Collection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionProgress'
              example:
                collection_id: example-id
                status: completed
                started_at: '2026-11-14T08:00:00Z'
                finished_at: '2026-11-14T08:00:20Z'
                records_count: 32
                expansion_level: 1
                selected_entities_count: 3
                vk_requests_count: 7
                error: null
                stop_reason: max_depth
        '404':
          description: Задание не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Состояние задания в памяти одного процесса до перезапуска. Уровень — число выполненных
        раундов, начальная выборка = 0. selected_entities_count относится к последней попытке расширения.
        Время в UTC; started_at — начало фонового этапа после проверки токена и seeds. Завершение раньше
        max_depth нормально при отсутствии новых сущностей или постов. stop_reason объясняет успешную
        остановку; error — сбой. Не запускать с несколькими workers.
  /collection/{collection_id}/records:
    get:
      tags:
      - collection
      summary: Получить страницу собранных постов
      operationId: getCollectionRecords
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          title: Collection Id
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRecords'
        '404':
          description: Задание не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Некорректная пагинация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Страница уже собранных уникальных постов, включая частичный результат running/failed.
        Непустые тексты; максимум 100 на страницу. Данные теряются после перезапуска.
components:
  schemas:
    ValidateRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
          pattern: \S
          writeOnly: true
          description: Ключ VK пользователя или сервисный ключ. Передаётся в теле запроса; не записывается
            в логи.
      additionalProperties: false
    ValidateResponse:
      type: object
      required:
      - valid
      - token_type
      properties:
        valid:
          type: boolean
          const: true
        token_type:
          type: string
          enum:
          - user
          - service
          description: Тип ключа доступа VK
        user:
          type: object
          description: Есть только у ключа пользователя
          required:
          - id
          - name
          properties:
            id:
              type: integer
            name:
              type: string
    Model:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - task
      - settings_schema
      properties:
        id: *id001
        name: *id001
        description:
          type: string
        task:
          type: string
          enum:
          - ner
        settings_schema:
          type: object
          description: JSON Schema 2020-12 настроек модели. Фронтенд использует её для отображения полей
            и проверки настроек.
          additionalProperties: true
    Seed:
      type: object
      description: Начальная запись. ID сообщества и пользователя передаются без URL; ID поста — owner_id_post_id.
        Формат и доступность проверяет бэкенд.
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - group
          - user
          - post
        id:
          type: string
          description: 'group/user: числовой id или короткое имя из адреса VK (vk.com/tpu_official → tpu_official).

            post: идентификатор вида {owner_id}_{post_id}, например -123456_789.

            '
          minLength: 1
          pattern: \S
      additionalProperties: false
    Rules:
      type: object
      additionalProperties: false
      required:
      - models
      - threshold
      properties:
        models:
          $ref: '#/components/schemas/SelectedModels'
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: 'Предлагаемая семантика для NER: минимальный score сущности, сохраняемой после
            обработки. Не является мерой схожести текстов. Применяется к результатам каждой выбранной
            модели; сам по себе не задаёт правило включения поста в выборку. Значение передаётся явно.'
        max_depth:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
          description: Максимальное число раундов расширения после загрузки начальных постов. Возможна
            досрочная остановка.
        sample_size:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Sample Size
          description: Максимум постов в случайной выборке для NER на каждой волне.
          default: 100
        top_entities:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Top Entities
          description: Максимум новых сущностей для поисковых запросов на каждой волне.
          default: 5
    StartRequest:
      type: object
      required:
      - token
      - seeds
      - rules
      properties:
        token:
          type: string
          minLength: 1
          pattern: \S
          writeOnly: true
          description: Ключ VK. Повторно проверяется при запуске сбора; предварительный /vk/validate не
            обязателен.
        seeds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Seed'
        rules:
          $ref: '#/components/schemas/Rules'
      additionalProperties: false
    StartResponse:
      type: object
      required:
      - collection_id
      - status
      properties:
        collection_id:
          type: string
          description: Идентификатор сбора, понадобится для получения статуса и результатов
          minLength: 1
        status:
          type: string
          enum:
          - running
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Машиночитаемый код ошибки
              enum:
              - INVALID_TOKEN
              - UNSUPPORTED_TOKEN_TYPE
              - MODEL_NOT_FOUND
              - VALIDATION_ERROR
              - VK_QUOTA_EXCEEDED
              - VK_UNAVAILABLE
              - INTERNAL_ERROR
              - COLLECTION_NOT_FOUND
            message:
              type: string
              description: Текст для пользователя
    GLiNERSettings: *id002
    WikiNeuralSettings: *id003
    SelectedModels:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Ключ — точное имя выбранной модели, значение — её настройки. Допускается одна или обе
        модели. Пустой объект и неизвестные модели недопустимы.
      properties:
        urchade/gliner_multi-v2.1:
          $ref: '#/components/schemas/GLiNERSettings'
        Babelscape/wikineural-multilingual-ner:
          $ref: '#/components/schemas/WikiNeuralSettings'
    CollectionProgress:
      properties:
        collection_id:
          type: string
          title: Collection Id
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          title: Status
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        records_count:
          type: integer
          minimum: 0.0
          title: Records Count
          default: 0
          description: Число уникальных постов с непустым текстом в памяти задания.
        expansion_level:
          type: integer
          minimum: 0.0
          title: Expansion Level
          default: 0
          description: Число выполненных раундов расширения; начальная выборка имеет уровень 0.
        selected_entities_count:
          type: integer
          minimum: 0.0
          title: Selected Entities Count
          default: 0
          description: Число новых сущностей, выбранных для последней попытки расширения; это не сумма
            за все волны.
        vk_requests_count:
          type: integer
          minimum: 0.0
          title: Vk Requests Count
          default: 0
          description: 'Все HTTP-попытки VK для этого запуска: проверка токена, начальные записи, стены,
            поиск, включая неудачные. Отдельный POST /vk/validate не включается.'
        error:
          anyOf:
          - $ref: '#/components/schemas/CollectionFailure'
          - type: 'null'
        stop_reason:
          anyOf:
          - type: string
            enum:
            - max_depth
            - no_text_records
            - no_new_entities
            - no_new_records
            - record_limit
          - type: 'null'
          title: Stop Reason
      type: object
      required:
      - collection_id
      - status
      title: CollectionProgress
    CollectionFailure:
      properties:
        code:
          type: string
          enum:
          - ML_NOT_AVAILABLE
          - ML_ERROR
          - VK_ERROR
          - INTERNAL_ERROR
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: CollectionFailure
    CollectionRecords:
      properties:
        collection_id:
          type: string
          title: Collection Id
        total:
          type: integer
          title: Total
        offset:
          type: integer
          title: Offset
        limit:
          type: integer
          title: Limit
        items:
          items:
            $ref: '#/components/schemas/VKPost'
          type: array
          title: Items
      type: object
      required:
      - collection_id
      - total
      - offset
      - limit
      - items
      title: CollectionRecords
    VKPost:
      properties:
        source:
          type: string
          const: vk
          title: Source
          default: vk
        kind:
          type: string
          const: post
          title: Kind
          default: post
        id:
          type: string
          title: Id
        owner_id:
          type: integer
          title: Owner Id
        text:
          type: string
          title: Text
        date:
          type: integer
          title: Date
      type: object
      required:
      - id
      - owner_id
      - text
      - date
      title: VKPost
      description: Пост на стене VK.
  responses:
    InvalidToken:
      description: Токен недействителен или истёк
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_TOKEN
              message: Токен VK недействителен
    UnsupportedTokenType:
      description: Токен действителен, но его тип не подходит для сбора данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNSUPPORTED_TOKEN_TYPE
              message: Ключ сообщества не подходит. Используйте сервисный ключ или ключ пользователя
    ModelNotFound:
      description: В rules.models указано неизвестное имя модели
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: MODEL_NOT_FOUND
              message: Модель unknown/model не найдена
    ValidationError:
      description: Некорректная структура запроса, пустые поля, неизвестный тип начальной записи, недоступная
        начальная запись или неверные настройки известной модели
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Нужно указать хотя бы одну начальную запись
    QuotaExceeded:
      description: VK API сообщил о превышении квоты или частоты запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VK_QUOTA_EXCEEDED
              message: Превышен лимит запросов к VK API. Повторите попытку позже
    VkUnavailable:
      description: VK API недоступен или вернул ошибку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VK_UNAVAILABLE
              message: Не удалось связаться с VK API
    InternalError:
      description: Непредвиденная ошибка бэкенда; подробности не возвращаются клиенту
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Внутренняя ошибка бэкенда
