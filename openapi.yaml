# SnowBall API 0.2.0
# Проект обновления SNO-9. Семантика threshold и правило отбора требуют подтверждения ML.
openapi: 3.1.0
info:
  title: snowball-parsing-app API
  version: 0.2.0
  description: 'Локальный API настольного приложения SnowBall. Бэкенд слушает только 127.0.0.1.

    Контракт описывает проверку VK-токена, каталог моделей и принятие задания на сбор.

    Можно выбрать одну или обе NER-модели. Настройки передаются отдельно для каждой модели.

    GLiNER показывается первым как основной вариант; это не означает автоматическое переключение между моделями.

    Ошибки HTTP возвращаются в едином формате Error.

    Версия 0.2.0 несовместима с 0.1.0: rules.model_id заменён на rules.models.

    Правило отбора записей и использования сущностей для следующей волны требует отдельного согласования с
    ML;

    сам факт выбора NER-моделей этого правила не определяет.'
servers:
- url: http://127.0.0.1:8000
  description: Локальный бэкенд (порт задаётся переменной SNOWBALL_PORT)
tags:
- name: service
  description: Служебные точки
- name: vk
  description: Работа с VK
- name: collection
  description: Сбор данных
paths:
  /health:
    get:
      tags:
      - service
      summary: Проверка, что бэкенд запущен
      operationId: health
      responses:
        '200':
          description: Бэкенд работает
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
              example:
                status: ok
  /vk/validate:
    post:
      tags:
      - vk
      summary: Проверить токен VK
      description: 'Проверяет, что токен действителен и подходит для сбора данных.

        Подходят сервисный ключ и ключ пользователя. Ключ сообщества отклоняется (403).

        '
      operationId: validateVkToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
            example:
              token: vk1.a.XXXXXXXX
      responses:
        '200':
          description: Токен действителен и подходит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
              examples:
                serviceToken:
                  summary: Сервисный ключ
                  value:
                    valid: true
                    token_type: service
                userToken:
                  summary: Ключ пользователя
                  value:
                    valid: true
                    token_type: user
                    user:
                      id: 123456
                      name: Иван Иванов
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/UnsupportedTokenType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/VkUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /collection/models:
    get:
      tags:
      - collection
      summary: Список доступных NER-моделей и их настроек
      description: 'Каталог моделей для rules.models. Порядок отображения: сначала GLiNER, затем WikiNEuRal.
        Выбор модели не означает, что её веса уже загружены.'
      operationId: listModels
      responses:
        '200':
          description: Доступные модели
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
              example:
              - id: urchade/gliner_multi-v2.1
                name: GLiNER multi v2.1
                description: Извлечение сущностей с заданными пользователем типами. Основной вариант.
                task: ner
                settings_schema: &id003
                  type: object
                  additionalProperties: false
                  required:
                  - labels
                  properties:
                    labels:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: &id002
                        type: string
                        minLength: 1
                        pattern: \S
                      description: Типы сущностей, например person, organization, city.
              - id: Babelscape/wikineural-multilingual-ner
                name: WikiNEuRal multilingual NER
                description: Дополнительная NER-модель. В этой версии пользовательские настройки не предусмотрены.
                task: ner
                settings_schema: &id004
                  type: object
                  additionalProperties: false
        '500':
          $ref: '#/components/responses/InternalError'
  /collection/start:
    post:
      tags:
      - collection
      summary: Запустить сбор данных
      description: 'Проверяет структуру запроса, VK-токен и доступность начальных записей, затем принимает
        задание на фоновый сбор.

        Возвращает 202 и collection_id, когда фоновое задание зарегистрировано. Это не подтверждение успешного
        завершения сбора или загрузки ML-моделей.

        Для GLiNER требуется непустой labels; для WikiNEuRal передаётся {}.

        Неизвестное имя модели возвращает 404 MODEL_NOT_FOUND; неверные настройки известной модели — 422 VALIDATION_ERROR.

        Получение статуса и результатов описывается отдельно. Поддержка нескольких моделей не задаёт способ
        объединения их результатов.

        Результаты каждой ML-модели и её ошибки обрабатываются отдельно, как в согласованной схеме ML.

        Этот HTTP-ответ содержит только данные о запуске; ML results в StartResponse не возвращаются.'
      operationId: startCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
            examples:
              gliner:
                summary: Только основная модель GLiNER
                value:
                  token: VK_TOKEN_PLACEHOLDER
                  seeds: &id001
                  - type: group
                    id: tpu_official
                  - type: post
                    id: '-123456_789'
                  rules:
                    models:
                      urchade/gliner_multi-v2.1:
                        labels:
                        - person
                        - organization
                        - city
                    threshold: 0.5
                    max_depth: 2
              both:
                summary: Обе модели независимо
                value:
                  token: VK_TOKEN_PLACEHOLDER
                  seeds: *id001
                  rules:
                    models:
                      urchade/gliner_multi-v2.1:
                        labels:
                        - organization
                        - city
                      Babelscape/wikineural-multilingual-ner: {}
                    threshold: 0.5
                    max_depth: 2
              wikineural:
                summary: Только WikiNEuRal
                value:
                  token: VK_TOKEN_PLACEHOLDER
                  seeds: *id001
                  rules:
                    models:
                      Babelscape/wikineural-multilingual-ner: {}
                    threshold: 0.5
                    max_depth: 2
      responses:
        '202':
          description: Сбор принят и запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
              example:
                collection_id: 3f2a9c1e
                status: running
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/UnsupportedTokenType'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '502':
          $ref: '#/components/responses/VkUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    ValidateRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
          pattern: \S
          writeOnly: true
          description: Ключ VK пользователя или сервисный ключ. Передаётся в теле запроса; не записывается
            в логи.
      additionalProperties: false
    ValidateResponse:
      type: object
      required:
      - valid
      - token_type
      properties:
        valid:
          type: boolean
          const: true
        token_type:
          type: string
          enum:
          - user
          - service
          description: Тип ключа доступа VK
        user:
          type: object
          description: Есть только у ключа пользователя
          required:
          - id
          - name
          properties:
            id:
              type: integer
            name:
              type: string
    Model:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - task
      - settings_schema
      properties:
        id: *id002
        name: *id002
        description:
          type: string
        task:
          type: string
          enum:
          - ner
        settings_schema:
          type: object
          description: JSON Schema 2020-12 настроек модели. Фронтенд использует её для отображения полей и
            проверки настроек.
          additionalProperties: true
    Seed:
      type: object
      description: Начальная запись. ID сообщества и пользователя передаются без URL; ID поста — owner_id_post_id.
        Формат и доступность проверяет бэкенд.
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - group
          - user
          - post
        id:
          type: string
          description: 'group/user: числовой id или короткое имя из адреса VK (vk.com/tpu_official → tpu_official).

            post: идентификатор вида {owner_id}_{post_id}, например -123456_789.

            '
          minLength: 1
          pattern: \S
      additionalProperties: false
    Rules:
      type: object
      additionalProperties: false
      required:
      - models
      - threshold
      properties:
        models:
          $ref: '#/components/schemas/SelectedModels'
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: 'Предлагаемая семантика для NER: минимальный score сущности, сохраняемой после обработки.
            Не является мерой схожести текстов. Применяется к результатам каждой выбранной модели; сам по себе
            не задаёт правило включения поста в выборку. Значение передаётся явно.'
        max_depth:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
          description: Максимальное число волн расширения после обработки начальных записей (волна 0).
    StartRequest:
      type: object
      required:
      - token
      - seeds
      - rules
      properties:
        token:
          type: string
          minLength: 1
          pattern: \S
          writeOnly: true
          description: Ключ VK. Повторно проверяется при запуске сбора; предварительный /vk/validate не обязателен.
        seeds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Seed'
        rules:
          $ref: '#/components/schemas/Rules'
      additionalProperties: false
    StartResponse:
      type: object
      required:
      - collection_id
      - status
      properties:
        collection_id:
          type: string
          description: Идентификатор сбора, понадобится для получения статуса и результатов
          minLength: 1
        status:
          type: string
          enum:
          - running
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Машиночитаемый код ошибки
              enum:
              - INVALID_TOKEN
              - UNSUPPORTED_TOKEN_TYPE
              - MODEL_NOT_FOUND
              - VALIDATION_ERROR
              - VK_QUOTA_EXCEEDED
              - VK_UNAVAILABLE
              - INTERNAL_ERROR
            message:
              type: string
              description: Текст для пользователя
    GLiNERSettings: *id003
    WikiNeuralSettings: *id004
    SelectedModels:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Ключ — точное имя выбранной модели, значение — её настройки. Допускается одна или обе модели.
        Пустой объект и неизвестные модели недопустимы.
      properties:
        urchade/gliner_multi-v2.1:
          $ref: '#/components/schemas/GLiNERSettings'
        Babelscape/wikineural-multilingual-ner:
          $ref: '#/components/schemas/WikiNeuralSettings'
  responses:
    InvalidToken:
      description: Токен недействителен или истёк
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_TOKEN
              message: Токен VK недействителен
    UnsupportedTokenType:
      description: Токен действителен, но его тип не подходит для сбора данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNSUPPORTED_TOKEN_TYPE
              message: Ключ сообщества не подходит. Используйте сервисный ключ или ключ пользователя
    ModelNotFound:
      description: В rules.models указано неизвестное имя модели
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: MODEL_NOT_FOUND
              message: Модель unknown/model не найдена
    ValidationError:
      description: Некорректная структура запроса, пустые поля, неизвестный тип начальной записи, недоступная
        начальная запись или неверные настройки известной модели
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Нужно указать хотя бы одну начальную запись
    QuotaExceeded:
      description: VK API сообщил о превышении квоты или частоты запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VK_QUOTA_EXCEEDED
              message: Превышен лимит запросов к VK API. Повторите попытку позже
    VkUnavailable:
      description: VK API недоступен или вернул ошибку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VK_UNAVAILABLE
              message: Не удалось связаться с VK API
    InternalError:
      description: Непредвиденная ошибка бэкенда; подробности не возвращаются клиенту
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Внутренняя ошибка бэкенда
